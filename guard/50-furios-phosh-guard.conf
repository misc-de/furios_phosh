# Drop-in for mobi.phosh.Shell.service (user unit). The "-" matters: whatever
# the guard does, it never keeps the shell from starting.
[Service]
ExecStartPre=-/usr/local/libexec/furios-phosh-guard check
# How it ended, for the next check: only a crash counts, not a restart.
ExecStopPost=-/usr/local/libexec/furios-phosh-guard stopped
